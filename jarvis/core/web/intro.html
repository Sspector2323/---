<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>J.A.R.V.I.S.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@300;500&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #01040a; overflow: hidden; cursor: none; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  #fade { position: fixed; inset: 0; background: #000; opacity: 1; pointer-events: none; transition: opacity .9s ease; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="fade"></div>
<script>
const P = new URLSearchParams(location.search);
const ROLE = P.get("role") || "main";             // main | left | right
const NAME = P.get("name") || "Сабина";
const GREETING = P.get("greeting") || `Моё почтение, ${NAME}. Я к вашим услугам.`;
const [G1, G2] = (() => { const i = GREETING.indexOf(". "); return i > 0 ? [GREETING.slice(0, i + 1), GREETING.slice(i + 2)] : [GREETING, ""]; })();
const END = 8.2;

const cv = document.getElementById("c"), ctx = cv.getContext("2d");
let W, H, DPR;
function resize() { DPR = devicePixelRatio || 1; W = innerWidth; H = innerHeight; cv.width = W * DPR; cv.height = H * DPR; ctx.setTransform(DPR, 0, 0, DPR, 0, 0); }
addEventListener("resize", resize); resize();

const CYAN = [56, 217, 255], BLUE = [10, 132, 255], WHITE = [230, 250, 255], OK = [74, 222, 128];
const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${Math.max(0, Math.min(1, a))})`;
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = x => 1 - Math.pow(1 - clamp(x), 3);
const prog = (t, start, dur) => ease((t - start) / dur);

// Частицы, стягивающиеся к реактору
const parts = Array.from({length: 180}, () => ({a: Math.random() * Math.PI * 2, r: 0.6 + Math.random() * 1.6,
  s: 0.25 + Math.random() * 0.6, z: Math.random() * 2 + 0.5, ph: Math.random() * 6}));

const SPRITE = (() => { const c = document.createElement("canvas"), s = 32; c.width = c.height = s;
  const g = c.getContext("2d"), gr = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
  gr.addColorStop(0, "rgba(220,250,255,1)"); gr.addColorStop(0.25, "rgba(56,217,255,.8)"); gr.addColorStop(1, "rgba(56,217,255,0)");
  g.fillStyle = gr; g.fillRect(0, 0, s, s); return c; })();

function arc(cx, cy, r, a0, a1, color, width, glow = 0) {
  ctx.beginPath(); ctx.arc(cx, cy, r, a0, a1);
  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.shadowBlur = glow; ctx.shadowColor = color; ctx.stroke();
}

function reactor(cx, cy, R, t, alpha) {
  ctx.save(); ctx.globalCompositeOperation = "lighter";
  const on = s => prog(t, s, 0.9) * alpha;

  // Ядро
  const pulse = 0.85 + 0.15 * Math.sin(t * 5);
  const core = prog(t, 0.2, 1.0) * alpha;
  let g = ctx.createRadialGradient(cx, cy, 0, cx, cy, R * 0.55 * pulse);
  g.addColorStop(0, rgba(WHITE, core)); g.addColorStop(0.25, rgba(CYAN, core * 0.9));
  g.addColorStop(0.6, rgba(BLUE, core * 0.25)); g.addColorStop(1, rgba(BLUE, 0));
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, R * 0.6, 0, 7); ctx.fill();

  // Внутреннее кольцо
  arc(cx, cy, R * 0.3, 0, Math.PI * 2 * on(0.4), rgba(CYAN, on(0.4)), 2, 12);

  // Сегменты (10 шт.), вращаются
  const segs = on(0.6), rot = t * 0.35;
  for (let i = 0; i < 10; i++) {
    const a = rot + i * Math.PI / 5;
    arc(cx, cy, R * 0.44, a + 0.06, a + (Math.PI / 5 - 0.06) * segs, rgba(CYAN, segs * 0.9), R * 0.07, i % 2 ? 0 : 18);
  }
  // Шкала-засечки, вращается навстречу (двумя путями — так в разы быстрее)
  const tk = on(0.9);
  [[true, WHITE, 0.9, 2, 0.67], [false, CYAN, 0.5, 1, 0.63]].forEach(([long, col, op, lw, k2]) => {
    ctx.beginPath();
    for (let i = 0; i < 120 * tk; i++) {
      if ((i % 10 === 0) !== long) continue;
      const a = -t * 0.18 + i * Math.PI / 60, r1 = R * 0.6, r2 = R * k2;
      ctx.moveTo(cx + Math.cos(a) * r1, cy + Math.sin(a) * r1); ctx.lineTo(cx + Math.cos(a) * r2, cy + Math.sin(a) * r2);
    }
    ctx.strokeStyle = rgba(col, tk * op); ctx.lineWidth = lw; ctx.shadowBlur = 6; ctx.shadowColor = rgba(CYAN, 1); ctx.stroke();
  });
  // Внешние дуги с разной скоростью
  [[0.78, 1.2, 1.7, 3], [0.86, -0.7, 2.6, 1.5], [0.95, 0.45, 1.1, 5], [1.03, -1.1, 0.6, 1]].forEach(([k, sp, len, w], i) => {
    const o = on(1.1 + i * 0.15), a = t * sp + i;
    arc(cx, cy, R * k, a, a + len * o, rgba(i % 2 ? BLUE : CYAN, o * 0.85), w, 14);
    arc(cx, cy, R * k, a + Math.PI, a + Math.PI + len * 0.5 * o, rgba(CYAN, o * 0.5), w * 0.6, 8);
  });
  // Ударные волны при включении
  [0.7, 1.3].forEach(s => { const p = clamp((t - s) / 1.6); if (p > 0 && p < 1)
    arc(cx, cy, R * (0.4 + p * 2.2), 0, Math.PI * 2, rgba(CYAN, (1 - p) * 0.45 * alpha), 2 + (1 - p) * 4, 20); });

  ctx.restore();
}

function particles(cx, cy, R, t, alpha) {
  ctx.save(); ctx.globalCompositeOperation = "lighter";
  for (const p of parts) {
    const pull = 1 - prog(t, 0, 3.2) * 0.55;
    const r = R * (p.r * pull + 0.25 * Math.sin(t * p.s + p.ph));
    const a = p.a + t * 0.08 * p.s;
    const x = cx + Math.cos(a) * r * 1.6, y = cy + Math.sin(a) * r;
    const tw = (0.4 + 0.6 * Math.abs(Math.sin(t * 2 + p.ph))) * prog(t, 0.2, 1.5) * alpha;
    const sz = p.z * 6; ctx.globalAlpha = clamp(tw);
    ctx.drawImage(SPRITE, x - sz / 2, y - sz / 2, sz, sz);
  }
  ctx.globalAlpha = 1; ctx.restore();
}

function grid(t, alpha) {
  const a = prog(t, 0, 1.5) * 0.07 * alpha, s = 46;
  ctx.strokeStyle = rgba(CYAN, a); ctx.lineWidth = 1;
  for (let x = (t * 6) % s; x < W; x += s) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
  for (let y = 0; y < H; y += s) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
  // Сканирующая линия
  const sy = ((t * 0.45) % 1) * H;
  const g = ctx.createLinearGradient(0, sy - 80, 0, sy);
  g.addColorStop(0, rgba(CYAN, 0)); g.addColorStop(1, rgba(CYAN, 0.12 * alpha));
  ctx.fillStyle = g; ctx.fillRect(0, sy - 80, W, 80);
}

function corners(t, alpha) {
  const a = prog(t, 0.5, 0.8) * alpha, m = 36, L = 70;
  ctx.strokeStyle = rgba(CYAN, a * 0.8); ctx.lineWidth = 2; ctx.shadowBlur = 10; ctx.shadowColor = rgba(CYAN, 1);
  [[m, m, 1, 1], [W - m, m, -1, 1], [m, H - m, 1, -1], [W - m, H - m, -1, -1]].forEach(([x, y, dx, dy]) => {
    ctx.beginPath(); ctx.moveTo(x, y + dy * L); ctx.lineTo(x, y); ctx.lineTo(x + dx * L, y); ctx.stroke(); });
  ctx.shadowBlur = 0;
}

function typed(text, t, start, cps) { return text.slice(0, Math.max(0, Math.floor((t - start) * cps))); }

function mainText(cx, cy, R, t, alpha) {
  ctx.save(); ctx.textAlign = "center"; ctx.textBaseline = "middle";
  const title = typed("J.A.R.V.I.S.", t, 2.0, 11);
  ctx.font = `700 ${Math.round(R * 0.26)}px Orbitron, Bahnschrift, "Segoe UI", sans-serif`;
  ctx.fillStyle = rgba(WHITE, alpha); ctx.shadowColor = rgba(CYAN, 1); ctx.shadowBlur = 24;
  ctx.letterSpacing = `${Math.round(R * 0.06)}px`;
  ctx.fillText(title, cx, cy + R * 1.38);
  ctx.letterSpacing = "4px";
  ctx.font = `500 ${Math.round(R * 0.075)}px "Exo 2", "Segoe UI", sans-serif`;
  ctx.fillStyle = rgba(CYAN, prog(t, 3.0, 0.8) * alpha * 0.8); ctx.shadowBlur = 8;
  ctx.fillText("JUST A RATHER VERY INTELLIGENT SYSTEM", cx, cy + R * 1.62);

  const a1 = prog(t, 3.6, 0.9) * alpha, a2 = prog(t, 4.5, 0.9) * alpha;
  ctx.letterSpacing = "1px";
  ctx.font = `300 ${Math.round(R * 0.2)}px "Exo 2", "Segoe UI Light", "Segoe UI", sans-serif`;
  ctx.fillStyle = rgba(WHITE, a1); ctx.shadowBlur = 18;
  ctx.fillText(G1, cx, cy - R * 1.45 + (1 - a1) * 14);
  ctx.font = `300 ${Math.round(R * 0.13)}px "Exo 2", "Segoe UI Light", "Segoe UI", sans-serif`;
  ctx.fillStyle = rgba(CYAN, a2); ctx.shadowBlur = 12;
  ctx.fillText(G2, cx, cy - R * 1.2 + (1 - a2) * 10);
  ctx.restore();
}

const CHECKS = ROLE === "left"
  ? ["ГОЛОСОВОЙ МОДУЛЬ", "РАСПОЗНАВАНИЕ РЕЧИ", "СИНТЕЗ ГОЛОСА", "ПАМЯТЬ", "ЛИЧНЫЕ ДЕЛА", "НАПОМИНАНИЯ", "ПОЧТА"]
  : ["СВЯЗЬ С CLAUDE", "NOTION · СВОДКА ЗАДАЧ", "GITHUB · РЕПОЗИТОРИИ", "CURSOR · CODEX", "УПРАВЛЕНИЕ ПК", "ДАШБОРД", "ПРОТОКОЛЫ БЕЗОПАСНОСТИ"];

function sideHud(t, alpha) {
  ctx.save(); ctx.textBaseline = "middle"; ctx.letterSpacing = "3px";
  const x = ROLE === "left" ? W * 0.07 : W * 0.5, fs = Math.max(14, Math.round(H * 0.022));
  ctx.font = `700 ${fs * 1.3}px Orbitron, Bahnschrift, sans-serif`;
  ctx.fillStyle = rgba(CYAN, prog(t, 0.8, 0.6) * alpha); ctx.shadowColor = rgba(CYAN, 1); ctx.shadowBlur = 12;
  ctx.fillText(typed(ROLE === "left" ? "SYSTEMS CHECK" : "NETWORK LINK", t, 0.9, 16), x, H * 0.2);
  ctx.font = `500 ${fs}px "Exo 2", Bahnschrift, sans-serif`;
  // ширины считаем по тексту, чтобы блок не вылезал за край экрана
  const labelW = Math.max(...CHECKS.map(l => ctx.measureText(l).width)) + fs * 1.5;
  const okW = ctx.measureText("ОНЛАЙН").width + fs * 2;
  const room = (ROLE === "left" ? W * 0.55 : W * 0.95) - x;
  const bw = Math.max(W * 0.05, Math.min(W * 0.16, room - labelW - okW));
  CHECKS.forEach((label, i) => {
    const s = 1.4 + i * 0.42, y = H * 0.28 + i * fs * 2.1;
    const a = prog(t, s, 0.3) * alpha; if (a <= 0) return;
    ctx.fillStyle = rgba(WHITE, a * 0.85); ctx.shadowBlur = 6; ctx.fillText(label, x, y);
    const bx = x + labelW, p = prog(t, s + 0.1, 0.5);
    ctx.fillStyle = rgba(CYAN, a * 0.15); ctx.fillRect(bx, y - 3, bw, 6);
    ctx.fillStyle = rgba(CYAN, a * 0.9); ctx.fillRect(bx, y - 3, bw * p, 6);
    if (p >= 1) { ctx.fillStyle = rgba(OK, a); ctx.fillText("ОНЛАЙН", bx + bw + 16, y); }
  });
  // Часы
  const now = new Date(), a = prog(t, 1.0, 0.8) * alpha;
  ctx.textAlign = "right"; ctx.letterSpacing = "2px";
  const cxr = ROLE === "left" ? W * 0.92 : W * 0.42;
  ctx.textAlign = ROLE === "left" ? "right" : "left";
  const tx = ROLE === "left" ? W * 0.92 : W * 0.08;
  ctx.font = `700 ${fs * 3.2}px Orbitron, Bahnschrift, sans-serif`; ctx.fillStyle = rgba(WHITE, a); ctx.shadowBlur = 20;
  ctx.fillText(now.toLocaleTimeString("ru-RU", {hour: "2-digit", minute: "2-digit"}), tx, H * 0.82);
  ctx.font = `500 ${fs * 1.1}px "Exo 2", sans-serif`; ctx.fillStyle = rgba(CYAN, a * 0.85);
  ctx.fillText(now.toLocaleDateString("ru-RU", {weekday: "long", day: "numeric", month: "long"}).toUpperCase(), tx, H * 0.82 + fs * 2.8);
  ctx.restore();
}

// Звук «включения» — синтезируется, без файлов (только на главном мониторе)
function powerUpSound() {
  try {
    const ac = new AudioContext(), now = ac.currentTime, out = ac.createGain();
    out.gain.value = 0.18; out.connect(ac.destination);
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = "sawtooth"; o.frequency.setValueAtTime(45, now); o.frequency.exponentialRampToValueAtTime(220, now + 2.2);
    const f = ac.createBiquadFilter(); f.type = "lowpass"; f.frequency.setValueAtTime(200, now); f.frequency.exponentialRampToValueAtTime(2400, now + 2.2);
    g.gain.setValueAtTime(0, now); g.gain.linearRampToValueAtTime(0.7, now + 0.4); g.gain.exponentialRampToValueAtTime(0.001, now + 3);
    o.connect(f).connect(g).connect(out); o.start(now); o.stop(now + 3.1);
    [880, 1320, 1760].forEach((fr, i) => {       // «звон» при появлении надписи
      const s = ac.createOscillator(), sg = ac.createGain(), t0 = now + 2.0 + i * 0.09;
      s.type = "sine"; s.frequency.value = fr; sg.gain.setValueAtTime(0, t0);
      sg.gain.linearRampToValueAtTime(0.25, t0 + 0.02); sg.gain.exponentialRampToValueAtTime(0.001, t0 + 1.6);
      s.connect(sg).connect(out); s.start(t0); s.stop(t0 + 1.7);
    });
  } catch (e) {}
}

let T0 = null;
let closing = false;
function frame(now) {
  if (T0 === null) { T0 = now; if (ROLE === "main") powerUpSound(); }
  const t = P.has("freeze") ? +P.get("freeze") : (now - T0) / 1000, alpha = t < END - 0.9 ? 1 : clamp((END - t) / 0.9);
  ctx.clearRect(0, 0, W, H);
  const bg = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, Math.max(W, H) * 0.7);
  bg.addColorStop(0, "#04121f"); bg.addColorStop(1, "#01040a"); ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
  grid(t, alpha); corners(t, alpha);
  if (ROLE === "main") {
    const R = Math.min(W, H) * 0.2, cx = W / 2, cy = H / 2 + R * 0.05;
    particles(cx, cy, R, t, alpha); reactor(cx, cy, R, t, alpha); mainText(cx, cy, R, t, alpha);
  } else {
    const R = Math.min(W, H) * 0.15, cx = ROLE === "left" ? W * 0.76 : W * 0.24, cy = H * 0.45;
    particles(cx, cy, R, t - 0.3, alpha); reactor(cx, cy, R, t - 0.3, alpha); sideHud(t, alpha);
  }
  if (P.has("freeze")) return;  // стоп-кадр для предпросмотра
  if (t < END) requestAnimationFrame(frame);
  else if (!closing) { closing = true; window.close(); }
}
document.getElementById("fade").style.opacity = 0;
addEventListener("click", () => window.close()); addEventListener("keydown", () => window.close());
(document.fonts ? document.fonts.ready : Promise.resolve()).finally(() => requestAnimationFrame(frame));
</script>
</body>
</html>
